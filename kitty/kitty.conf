# Theme — static ink black, ignores wallpaper/wallust
# Wallpaper-synced alternative: include ./kitty-themes/01-Wallust.conf
include ./kitty-themes/ink-black.conf

# Font (Ghostty style)
font_family JetBrainsMonoNL Nerd Font
# font_family JetBrainsMono Nerd Font
bold_font auto
ZedMono Nerd Font
italic_font auto
bold_italic_font auto
font_size 14.0

disable_ligatures never

# Transparency & blur
# background_opacity 0.7
# dynamic_background_opacity 1
background_blur 100

# Window size (similar to Ghostty)
initial_window_width 105c
initial_window_height 36c

# Window padding
window_padding_width 4 10 4 10
window_padding_width_left 20
window_padding_width_right 4
window_padding_width_top 4
window_padding_width_bottom 4

# Window behavior
confirm_os_window_close 0

# Disable Ctrl+Shift+Q
map ctrl+shift+q no_op

# Cursor
cursor_trail 1

# Display server
linux_display_server auto

# Scrolling
scrollback_lines 2000
wheel_scroll_min_lines 1

# Bell
enable_audio_bell no

# Colors: foreground/background/cursor come from the theme include above
selection_foreground none
selection_background none
