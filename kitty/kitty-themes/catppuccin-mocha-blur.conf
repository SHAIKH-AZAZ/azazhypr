# vim:ft=kitty
## name: Catppuccin Mocha Blur
## source: Converted from the supplied Zed "Catppuccin Blur" theme

# Base colors
foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #f5e0dc

# Cursor
cursor                   #f5e0dc
cursor_text_color        #1e1e2e

# Dim text — approximates Zed terminal.dim_foreground #7f849c
dim_opacity              0.55

# Transparency and blur
# The Zed background alpha is D7/FF, which is approximately 0.84.
background_opacity       0.84
background_blur          32
dynamic_background_opacity yes

# Scrollbar
scrollbar_handle_color   #9399b2
scrollbar_track_color    #45475a

# URLs
url_color                #89dceb

# Kitty window borders
active_border_color      #b4befe
inactive_border_color    #6c7086
bell_border_color        #f9e2af

# OS title bars
wayland_titlebar_color   background
macos_titlebar_color     background

# Tab bar
tab_bar_background       #11111b
tab_bar_margin_color     #11111b
active_tab_foreground    #11111b
active_tab_background    #cba6f7
active_tab_font_style    bold
inactive_tab_foreground  #cdd6f4
inactive_tab_background  #181825
inactive_tab_font_style  normal

# Marks
mark1_foreground         #1e1e2e
mark1_background         #b4befe
mark2_foreground         #1e1e2e
mark2_background         #cba6f7
mark3_foreground         #1e1e2e
mark3_background         #74c7ec

# ANSI palette: normal colors
color0                   #45475a
color1                   #f38ba8
color2                   #a6e3a1
color3                   #f9e2af
color4                   #89b4fa
color5                   #f5c2e7
color6                   #94e2d5
color7                   #a6adc8

# ANSI palette: bright colors
color8                   #585b70
color9                   #f37799
color10                  #89d88b
color11                  #ebd391
color12                  #74a8fc
color13                  #f2aede
color14                  #6bd7ca
color15                  #bac2de
